<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>SmartObstacleDetector</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦯</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Détection d'objets IA 🔎</h1>
    <p class="welcome-text">
      👋 Bienvenue sur votre détecteur d'objets IA ! Cliquez sur
      <strong>Commencer la détection</strong> pour activer l'intelligence
      artificielle et commencer l’analyse en temps réel.
    </p>

    <div class="container">
      <div class="mode-selector">
        <label for="mode">🧠 Choisir le mode de détection :</label>
        <select id="mode">
          <option value="yolo">Détection YOLO</option>
          <option value="speaking">Détection avec SSD</option>
          <option value="yolo11">Détection YOLO11</option>
        </select>
        <div class="cam-source">
          <label>🎥 Source caméra :</label>
          <input type="radio" name="cam" value="phone" id="camPhone" />
          <label for="camPhone">Téléphone</label>
          <input type="radio" name="cam" value="pc" id="camPC" checked />
          <label for="camPC">Ordinateur</label>
        </div>
      </div>

      <button id="startBtn">🚀 Commencer la détection</button>
      <button id="stopBtn">🛑 Arrêter la détection</button>
      <p id="status"><span class="status-dot"></span> En attente...</p>
    </div>

    <script src="script.js"></script>

    <footer class="footer">
      <p>💡 Projet de détection d'objets IA</p>
      <p>© 2025 - Tous droits réservés</p>
    </footer>

    <div class="clock-container">
      Heure actuelle : <span id="clock">--:--:--</span>
    </div>
  </body>
</html>
